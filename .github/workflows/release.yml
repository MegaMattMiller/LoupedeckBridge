# Build, test, sign and publish a release, when a version tag (v0.6.0) is pushed (tools/release.sh), or
# from "Run workflow" with a version whose tag is already pushed (select that tag as the ref: the
# `release` environment only accepts v* tags). One release carries both platforms' downloads (milestone 7).
#   build:          (macOS) checks bridge.__version__ and CHANGELOG.md match the tag, builds the release app, saves
#                   that exact build, then runs the suite with its bundled Python (test tools pinned by hash)
#   build-windows:  (Windows) the same for the Windows release: builds and zips it, saves that exact zip, then runs
#                   the suite with its bundled Python
#   sign:           (macOS) in the `release` environment, which has the signing key and a required reviewer: it
#                   waits for your approval, checks it has both saved builds byte for byte, and signs both in one
#                   step that deletes the key's keychain and files when it ends (the Mac app with codesign, the
#                   Windows zip with a detached .p7s, tools/sign_windows_zip.sh); then checks the updater and
#                   tools/install.sh will accept the Mac app
#   verify-windows: (Windows, no secrets) the tray app's own check and tools/install.ps1 accept the signed zip, and
#                   refuse a changed byte and another key (tools/check_windows_release.ps1)
#   publish:        only if all five downloads are there: the GitHub release, with the changelog section as notes
# Only GitHub's own actions, pinned to commits. No pull_request triggers here.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.6.0 (its tag v0.6.0 must already be on GitHub)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
      zip_sha256: ${{ steps.save.outputs.zip_sha256 }}
    steps:
      - name: Which version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          version="${INPUT_VERSION:-$REF_NAME}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$version' isn't a version like 0.5.0"; exit 1; }
          # "Run workflow" must be started from that tag (the release environment only accepts v* tags)
          [ "$REF" = "refs/tags/v$version" ] || { echo "::error::run this from the tag v$version, not $REF"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/v${{ steps.version.outputs.version }}
          persist-credentials: false
      - name: Which commit (the publish job signs and releases this one)
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: The version and changelog match
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 tools/check_release.py "$VERSION"
      - name: Build the release app (unsigned)
        run: tools/build_release_app.sh dist
      - name: Save the build (zipped, so its links and permissions survive) before any test code runs
        id: save
        run: |
          ditto -c -k --keepParent dist/LoupedeckBridge.app unsigned.zip
          echo "zip_sha256=$(shasum -a 256 unsigned.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 > "$RUNNER_TEMP/build-manifest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unsigned-app
          path: unsigned.zip
          retention-days: 3
          if-no-files-found: error
      - name: Test the build with its own Python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # a venv that shares the bundle's packages, so the suite tests those; the test tools go in the venv
          dist/LoupedeckBridge.app/Contents/Resources/python/bin/python3 -m venv --system-site-packages --without-pip .venv
          .venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps \
            -r tools/release-test-requirements.txt
          .venv/bin/python -m pytest -q
          LB_RELEASE_APP="$PWD/dist/LoupedeckBridge.app" .venv/bin/python -m pytest -q tests/test_release_bundle.py
      - name: The tests left the build exactly as it was saved
        run: |
          find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 | diff -q "$RUNNER_TEMP/build-manifest" - >/dev/null \
            || { echo "::error::running the tests changed the build"; exit 1; }


  build-intel:
    name: Build and test (Intel Mac)
    runs-on: macos-15-intel
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
      zip_sha256: ${{ steps.save.outputs.zip_sha256 }}
    steps:
      - name: Which version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          version="${INPUT_VERSION:-$REF_NAME}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$version' isn't a version like 0.5.0"; exit 1; }
          [ "$REF" = "refs/tags/v$version" ] || { echo "::error::run this from the tag v$version, not $REF"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/v${{ steps.version.outputs.version }}
          persist-credentials: false
      - name: Which commit (the sign job checks every build built the same one)
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: The version and changelog match
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 tools/check_release.py "$VERSION"
      - name: Build the Intel release app (unsigned)
        run: tools/build_release_app.sh dist
      - name: It really is an Intel build
        run: |
          arch="$(plutil -extract LBArch raw dist/LoupedeckBridge.app/Contents/Info.plist)"
          [ "$arch" = x86_64 ] || { echo "::error::this runner built a $arch app, not x86_64"; exit 1; }
      - name: Save the build (zipped, so its links and permissions survive) before any test code runs
        id: save
        run: |
          ditto -c -k --keepParent dist/LoupedeckBridge.app unsigned.zip
          echo "zip_sha256=$(shasum -a 256 unsigned.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 > "$RUNNER_TEMP/build-manifest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unsigned-app-intel
          path: unsigned.zip
          retention-days: 3
          if-no-files-found: error
      - name: Test the build with its own Python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # a venv that shares the bundle's packages, so the suite tests those; the test tools go in the venv
          dist/LoupedeckBridge.app/Contents/Resources/python/bin/python3 -m venv --system-site-packages --without-pip .venv
          .venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps \
            -r tools/release-test-requirements.txt
          .venv/bin/python -m pytest -q
          LB_RELEASE_APP="$PWD/dist/LoupedeckBridge.app" .venv/bin/python -m pytest -q tests/test_release_bundle.py
      - name: The tests left the build exactly as it was saved
        run: |
          find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 | diff -q "$RUNNER_TEMP/build-manifest" - >/dev/null \
            || { echo "::error::running the tests changed the build"; exit 1; }


  build-windows:
    name: Build and test (Windows)
    runs-on: windows-2025
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      zip_name: ${{ steps.save.outputs.zip_name }}
      zip_sha256: ${{ steps.save.outputs.zip_sha256 }}
    steps:
      - name: Which version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          version="${INPUT_VERSION:-$REF_NAME}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$version' isn't a version like 0.6.0"; exit 1; }
          [ "$REF" = "refs/tags/v$version" ] || { echo "::error::run this from the tag v$version, not $REF"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/v${{ steps.version.outputs.version }}
          persist-credentials: false
      - name: Which commit (the sign job checks it's the one the Mac build built)
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: The version and changelog match
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python tools/check_release.py "$VERSION" > /dev/null
      - name: Build the Windows release (unsigned)
        run: |
          pwsh -File tools/build_windows_app.ps1 -Release dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Save the zip before any test code runs
        id: save
        run: |
          pwsh -File tools/package_windows_release.ps1 dist/LoupedeckBridge unsigned
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $zip = Get-ChildItem unsigned -Filter '*.zip' | Select-Object -First 1
          "zip_name=$($zip.Name)" >> $env:GITHUB_OUTPUT
          "zip_sha256=$((Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Get-ChildItem -Recurse -File dist | Sort-Object FullName |
            ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash)  $($_.FullName)" } |
            Set-Content "$env:RUNNER_TEMP\build-manifest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unsigned-windows
          path: unsigned/*.zip
          retention-days: 3
          if-no-files-found: error
      - name: Test the build with its own Python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # a venv that shares the bundle's packages, so the suite tests those; the test tools go in the venv
          dist\LoupedeckBridge\python\python.exe -m venv --system-site-packages --without-pip .venv
          .venv\Scripts\python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps `
            -r tools/release-test-requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv\Scripts\python -m pytest -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:LB_WINDOWS_RELEASE_DIR = "$PWD\dist\LoupedeckBridge"
          .venv\Scripts\python -m pytest -q tests/test_windows_release_bundle.py
      - name: The tests left the build exactly as it was saved
        run: |
          $now = Get-ChildItem -Recurse -File dist | Sort-Object FullName |
            ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash)  $($_.FullName)" }
          if (Compare-Object (Get-Content "$env:RUNNER_TEMP\build-manifest") $now) {
            "::error::running the tests changed the build"; exit 1
          }

  sign:
    name: Sign (after your approval)
    needs: [build, build-intel, build-windows]
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: The tag still points at the commit that was built and tested, by every build
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          INTEL_COMMIT: ${{ needs.build-intel.outputs.commit }}
          WINDOWS_COMMIT: ${{ needs.build-windows.outputs.commit }}
        run: |
          [ "$WINDOWS_COMMIT" = "$COMMIT" ] || { echo "::error::the Windows build is of $WINDOWS_COMMIT, the Mac's of $COMMIT"; exit 1; }
          [ "$INTEL_COMMIT" = "$COMMIT" ] || { echo "::error::the Intel build is of $INTEL_COMMIT, the Apple Silicon one's of $COMMIT"; exit 1; }
          tagged="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" \
            | awk '$2 ~ /\^\{\}$/ {peeled=$1} $2 !~ /\^\{\}$/ {plain=$1} END {print (peeled != "" ? peeled : plain)}')"
          [ "$tagged" = "$COMMIT" ] || { echo "::error::v$VERSION points at ${tagged:-nothing} now, not the built $COMMIT"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: unsigned-app
      - name: Unpack the saved build, after checking it's byte for byte what the build job saved
        env:
          ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
        run: |
          [ "$(shasum -a 256 unsigned.zip | awk '{print $1}')" = "$ZIP_SHA256" ] \
            || { echo "::error::the downloaded build isn't the one the build job saved"; exit 1; }
          ditto -x -k unsigned.zip dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: unsigned-app-intel
          path: unsigned-intel          # not the working directory: it holds the other Mac's unsigned.zip
      - name: Unpack the saved Intel build, after the same byte-for-byte check
        env:
          ZIP_SHA256: ${{ needs.build-intel.outputs.zip_sha256 }}
        run: |
          [ "$(shasum -a 256 unsigned-intel/unsigned.zip | awk '{print $1}')" = "$ZIP_SHA256" ] \
            || { echo "::error::the downloaded Intel build isn't the one its build job saved"; exit 1; }
          ditto -x -k unsigned-intel/unsigned.zip dist-intel
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: unsigned-windows
          path: windows-zip          # not windows/: the checkout has the tray app's source there
      - name: The Windows zip is byte for byte what its build job saved
        env:
          ZIP_NAME: ${{ needs.build-windows.outputs.zip_name }}
          ZIP_SHA256: ${{ needs.build-windows.outputs.zip_sha256 }}
        run: |
          [ "$(ls windows-zip)" = "$ZIP_NAME" ] || { echo "::error::expected only $ZIP_NAME, found: $(ls windows-zip)"; exit 1; }
          [ "$(shasum -a 256 "windows-zip/$ZIP_NAME" | awk '{print $1}')" = "$ZIP_SHA256" ] \
            || { echo "::error::the downloaded Windows zip isn't the one its build job saved"; exit 1; }
      - name: Sign both (the key exists during this step only; no code from either build runs in it)
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
          ZIP_NAME: ${{ needs.build-windows.outputs.zip_name }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/p12-password"' EXIT
          [ -n "$MAC_SIGNING_P12" ] || { echo "::error::the release environment has no MAC_SIGNING_P12 (tools/make_signing_identity.sh)"; exit 1; }
          umask 077
          printf '%s' "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          printf '%s' "$MAC_SIGNING_P12_PASSWORD" > "$RUNNER_TEMP/p12-password"
          tools/import_signing_identity.sh "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/p12-password" "$keychain"
          OPENSSL=/usr/bin/openssl tools/sign_windows_zip.sh "windows-zip/$ZIP_NAME" "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/p12-password"
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/p12-password"
          tools/sign_release_app.sh dist/LoupedeckBridge.app "LoupedeckBridge Release"
          tools/sign_release_app.sh dist-intel/LoupedeckBridge.app "LoupedeckBridge Release"
      - name: The updater and tools/install.sh will accept both Macs
        run: |
          # This runner is Apple Silicon, so only that app can be run here; the Intel app's own check is
          # verify-intel's job. The signature and certificate checks below execute nothing.
          app=dist/LoupedeckBridge.app
          "$app/Contents/MacOS/LoupedeckBridge" --check-signature "$app"
          pinned="$(sed -n 's/^PINNED_SIGNER_SHA256_DEFAULT="\(.*\)"$/\1/p' tools/install.sh)"
          [ -n "$pinned" ] || { echo "::error::tools/install.sh pins no release key"; exit 1; }
          for app in dist/LoupedeckBridge.app dist-intel/LoupedeckBridge.app; do
            codesign --verify --strict -R="identifier \"io.github.megamattmiller.loupedeckbridge\"" "$app"
            rm -f "$RUNNER_TEMP/cert0"
            codesign -d --extract-certificates="$RUNNER_TEMP/cert" "$app"
            signer="$(shasum -a 256 "$RUNNER_TEMP/cert0" | awk '{print $1}')"
            [ "$signer" = "$pinned" ] || { echo "::error::$app is signed with $signer, but tools/install.sh pins '$pinned'"; exit 1; }
          done
      - name: Package both platforms' downloads
        run: |
          tools/package_release.sh dist/LoupedeckBridge.app out
          tools/package_release.sh dist-intel/LoupedeckBridge.app out
          cp windows-zip/* out/
          (cd windows-zip && for f in *.zip; do shasum -a 256 "$f" > "../out/$f.sha256"; done)
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signed-release
          path: out/
          retention-days: 3
          if-no-files-found: error
      - name: Make sure the keychain is gone
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true

  verify-intel:
    name: Check the signed Intel release on an Intel Mac
    needs: [build-intel, sign]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.build-intel.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-release
          path: signed
      - name: The Intel app's own check and tools/install.sh accept it (the real pins)
        env:
          VERSION: ${{ needs.build-intel.outputs.version }}
        run: |
          # The one place an Intel binary may be run: the signing runner is Apple Silicon.
          ditto -x -k "signed/LoupedeckBridge-v$VERSION-macos-x86_64.zip" unzipped
          app=unzipped/LoupedeckBridge.app
          [ -d "$app" ] || { echo "::error::the Intel download holds no LoupedeckBridge.app"; exit 1; }
          arch="$(plutil -extract LBArch raw "$app/Contents/Info.plist")"
          [ "$arch" = x86_64 ] || { echo "::error::the Intel download says it's $arch"; exit 1; }
          "$app/Contents/MacOS/LoupedeckBridge" --check-signature "$app"
          pinned="$(sed -n 's/^PINNED_SIGNER_SHA256_DEFAULT="\(.*\)"$/\1/p' tools/install.sh)"
          codesign --verify --strict -R="identifier \"io.github.megamattmiller.loupedeckbridge\"" "$app"
          codesign -d --extract-certificates="$RUNNER_TEMP/cert" "$app"
          signer="$(shasum -a 256 "$RUNNER_TEMP/cert0" | awk '{print $1}')"
          [ -n "$pinned" ] && [ "$signer" = "$pinned" ] || { echo "::error::signed with $signer, but tools/install.sh pins '$pinned'"; exit 1; }
      - name: A changed byte is refused
        run: |
          ditto unzipped/LoupedeckBridge.app "$RUNNER_TEMP/tampered/LoupedeckBridge.app"
          printf '#' >> "$RUNNER_TEMP/tampered/LoupedeckBridge.app/Contents/Resources/app/bridge/__init__.py"
          if unzipped/LoupedeckBridge.app/Contents/MacOS/LoupedeckBridge --check-signature \
              "$RUNNER_TEMP/tampered/LoupedeckBridge.app"; then
            echo "::error::the Intel app's check accepted a changed app"; exit 1
          fi


  verify-windows:
    name: Check the signed Windows release on Windows
    needs: [build, sign]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-release
          path: signed
      - name: The tray app and tools/install.ps1 accept it (the real pins), and refuse a changed byte and another key
        run: |
          pwsh -File tools/check_windows_release.ps1 -Dir signed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  publish:
    name: Publish
    needs: [build, build-intel, build-windows, sign, verify-intel, verify-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-release
          path: out
      - name: Every download is there, and matches its .sha256 (each Mac's update check needs its own zip)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Both Macs' zips must be in every release: an installed app looks for its own arch's name and
          # quietly finds no update without it.
          for f in "LoupedeckBridge-v$VERSION-macos-arm64.zip" "LoupedeckBridge-v$VERSION-macos-arm64.zip.sha256" \
                   "LoupedeckBridge-v$VERSION-macos-x86_64.zip" "LoupedeckBridge-v$VERSION-macos-x86_64.zip.sha256" \
                   "LoupedeckBridge-v$VERSION-windows-x64.zip" "LoupedeckBridge-v$VERSION-windows-x64.zip.sha256" \
                   "LoupedeckBridge-v$VERSION-windows-x64.zip.p7s"; do
            [ -f "out/$f" ] || { echo "::error::$f is missing, so nothing is published"; exit 1; }
          done
          [ "$(ls out | wc -l)" -eq 7 ] || { echo "::error::expected exactly seven downloads: $(ls out)"; exit 1; }
          (cd out && sha256sum -c ./*.sha256)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 tools/check_release.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" out/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "LoupedeckBridge v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
