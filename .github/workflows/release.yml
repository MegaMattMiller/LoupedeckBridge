# Build, test, sign and publish a release, when a version tag (v0.5.1) is pushed (tools/release.sh), or
# from "Run workflow" with a version whose tag is already pushed (select that tag as the ref: the
# `release` environment only accepts v* tags).
#   build:    checks bridge.__version__ and CHANGELOG.md match the tag, builds the release app, saves that
#             exact build, then runs the suite with its bundled Python (test tools pinned by hash)
#   publish:  in the `release` environment, which has the signing key and a required reviewer: it waits
#             for your approval, checks it has the saved build byte for byte, signs it in one step that
#             deletes the key's keychain when it ends, checks the updater and tools/install.sh will accept
#             it, and publishes the GitHub release with the changelog section as notes
# Only GitHub's own actions, pinned to commits. No pull_request triggers here.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.5.1 (its tag v0.5.1 must already be on GitHub)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_sha256: ${{ steps.save.outputs.zip_sha256 }}
    steps:
      - name: Which version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-$REF_NAME}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$version' isn't a version like 0.5.0"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/v${{ steps.version.outputs.version }}
          persist-credentials: false
      - name: The version and changelog match
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 tools/check_release.py "$VERSION"
      - name: Build the release app (unsigned)
        run: tools/build_release_app.sh dist
      - name: Save the build (zipped, so its links and permissions survive) before any test code runs
        id: save
        run: |
          ditto -c -k --keepParent dist/LoupedeckBridge.app unsigned.zip
          echo "zip_sha256=$(shasum -a 256 unsigned.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 > "$RUNNER_TEMP/build-manifest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unsigned-app
          path: unsigned.zip
          retention-days: 3
          if-no-files-found: error
      - name: Test the build with its own Python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # a venv that shares the bundle's packages, so the suite tests those; the test tools go in the venv
          dist/LoupedeckBridge.app/Contents/Resources/python/bin/python3 -m venv --system-site-packages --without-pip .venv
          .venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps \
            -r tools/release-test-requirements.txt
          .venv/bin/python -m pytest -q
          LB_RELEASE_APP="$PWD/dist/LoupedeckBridge.app" .venv/bin/python -m pytest -q tests/test_release_bundle.py
      - name: The tests left the build exactly as it was saved
        run: |
          find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 | diff -q "$RUNNER_TEMP/build-manifest" - >/dev/null \
            || { echo "::error::running the tests changed the build"; exit 1; }

  publish:
    name: Sign and publish (after your approval)
    needs: build
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/v${{ needs.build.outputs.version }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: unsigned-app
      - name: Unpack the saved build, after checking it's byte for byte what the build job saved
        env:
          ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
        run: |
          [ "$(shasum -a 256 unsigned.zip | awk '{print $1}')" = "$ZIP_SHA256" ] \
            || { echo "::error::the downloaded build isn't the one the build job saved"; exit 1; }
          ditto -x -k unsigned.zip dist
      - name: Sign (the key exists during this step only; no code from the build runs in it)
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/p12-password"' EXIT
          [ -n "$MAC_SIGNING_P12" ] || { echo "::error::the release environment has no MAC_SIGNING_P12 (tools/make_signing_identity.sh)"; exit 1; }
          umask 077
          printf '%s' "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          printf '%s' "$MAC_SIGNING_P12_PASSWORD" > "$RUNNER_TEMP/p12-password"
          tools/import_signing_identity.sh "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/p12-password" "$keychain"
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/p12-password"
          tools/sign_release_app.sh dist/LoupedeckBridge.app "LoupedeckBridge Release"
      - name: The updater and tools/install.sh will accept it
        run: |
          app=dist/LoupedeckBridge.app
          "$app/Contents/MacOS/LoupedeckBridge" --check-signature "$app"
          pinned="$(sed -n 's/^PINNED_SIGNER_SHA256_DEFAULT="\(.*\)"$/\1/p' tools/install.sh)"
          codesign --verify --strict "$app"
          codesign -d --extract-certificates="$RUNNER_TEMP/cert" "$app"
          signer="$(shasum -a 256 "$RUNNER_TEMP/cert0" | awk '{print $1}')"
          [ -n "$pinned" ] && [ "$signer" = "$pinned" ] || { echo "::error::signed with $signer, but tools/install.sh pins '$pinned'"; exit 1; }
      - name: Package
        run: tools/package_release.sh dist/LoupedeckBridge.app out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 tools/check_release.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" out/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "LoupedeckBridge v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Make sure the keychain is gone
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
